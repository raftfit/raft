<!doctype html>
<meta charset="utf-8">
<title>Raft cluster</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f5; margin: 24px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 10px; padding: 16px 20px; width: 220px;
          border-top: 6px solid #a1a1aa; box-shadow: 0 1px 3px #0002; }
  .LEADER    { border-color: #16a34a; }
  .CANDIDATE { border-color: #f59e0b; }
  .FOLLOWER  { border-color: #3b82f6; }
  .PAUSED    { border-color: #8b5cf6; opacity: .75; }
  .DOWN      { border-color: #dc2626; opacity: .6; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  .role { font-weight: 600; margin-bottom: 8px; }
  td { padding: 2px 8px 2px 0; }
  td:first-child { color: #71717a; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  button { padding: 4px 10px; border: 1px solid #d4d4d8; border-radius: 6px;
           background: #fff; cursor: pointer; }
  button:hover { background: #f4f4f5; }
  .send { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
  .send input { padding: 4px 8px; border: 1px solid #d4d4d8; border-radius: 6px; width: 240px; }
  .send select { padding: 4px 8px; border: 1px solid #d4d4d8; border-radius: 6px; background: #fff; }
  #sendResult.ok  { color: #16a34a; }
  #sendResult.err { color: #dc2626; }
  .log { margin-top: 10px; max-height: 200px; overflow-y: auto; font: 12px ui-monospace, monospace; }
  .log div { padding: 1px 0; }
  .log .uncommitted { color: #a1a1aa; }
</style>

<h1>Raft cluster</h1>
<form class="send" id="send">
  <input id="command" placeholder="command" autocomplete="off">
  <select id="target">
    <option value="auto">auto (leader)</option>
  </select>
  <button>Send</button>
  <span id="sendResult"></span>
</form>
<div class="row" id="nodes"></div>

<script>
  const NODES = [8081, 8082, 8083];
  const nodesEl = document.getElementById('nodes');
  let last = '';

  async function load(port) {
    try {
      const opts = { signal: AbortSignal.timeout(250) };
      const [status, logs] = await Promise.all([
        fetch(`http://localhost:${port}/api/status`, opts).then(r => r.json()),
        fetch(`http://localhost:${port}/api/logs`, opts).then(r => r.json()),
      ]);
      return { ...status, entries: logs.entries, port };
    } catch {
      return { nodeId: `:${port}`, role: 'DOWN', port };
    }
  }

  function card(s) {
    return `<div class="card ${s.paused ? 'PAUSED' : s.role}">
      <h2>${s.nodeId}</h2>
      <div class="role">${s.role}${s.paused ? ' (paused)' : ''}</div>
      ${s.role === 'DOWN' ? '' : `<table>
        <tr><td>term</td><td>${s.term}</td></tr>
        <tr><td>leader</td><td>${s.leaderId ?? '—'}</td></tr>
        <tr><td>votedFor</td><td>${s.votedFor ?? '—'}</td></tr>
        <tr><td>commit</td><td>${s.commitIndex} / ${s.lastLogIndex}</td></tr>
      </table>
      <div class="log">${s.entries.map((e, i) =>
        `<div class="${i + 1 > s.commitIndex ? 'uncommitted' : ''}">${i + 1} [t${e.term}] ${escape(e.command ?? '(no-op)')}</div>`
      ).join('')}</div>
      <div class="actions">
        <button data-port="${s.port}" data-action="${s.paused ? 'resume' : 'pause'}">${s.paused ? 'Resume' : 'Pause'}</button>
        <button data-port="${s.port}" data-action="kill">Kill</button>
      </div>`}
    </div>`;
  }

  const escape = t => t.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
  let lastStatuses = [];

  const targetEl = document.getElementById('target');
  for (const port of NODES) targetEl.add(new Option(`:${port}`, port));

  function updateTargets(all) {
    for (const s of all) {
      const opt = [...targetEl.options].find(o => o.value == s.port);
      const label = s.role === 'DOWN' ? `:${s.port} (down)` : `${s.nodeId} :${s.port}`;
      if (opt.text !== label) opt.text = label;
    }
  }

  async function tick() {
    const all = await Promise.all(NODES.map(load));
    lastStatuses = all;
    updateTargets(all);
    const html = all.map(card).join('');
    if (html !== last) {
      nodesEl.innerHTML = html;
      last = html;
    }
  }

  nodesEl.addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.action === 'kill' && !confirm(`Kill node on :${b.dataset.port}?`)) return;
    try {
      await fetch(`http://localhost:${b.dataset.port}/api/${b.dataset.action}`, { method: 'POST' });
    } catch {}
    tick();
  });

  document.getElementById('send').addEventListener('submit', async e => {
    e.preventDefault();
    const input = document.getElementById('command');
    const result = document.getElementById('sendResult');
    const show = (text, ok) => { result.textContent = text; result.className = ok ? 'ok' : 'err'; };
    if (!input.value) return;

    let target;
    if (targetEl.value === 'auto') {
      target = lastStatuses.find(s => s.role === 'LEADER' && !s.paused);
      if (!target) { show('no leader', false); return; }
    } else {
      target = lastStatuses.find(s => s.port == targetEl.value);
    }
    const name = target.role === 'DOWN' ? `:${target.port}` : target.nodeId;

    try {
      const r = await fetch(`http://localhost:${target.port}/api/entries`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: input.value }),
      });
      if (r.status === 503) {
        show(`${name} is paused`, false);
      } else {
        const body = await r.json();
        if (body.accepted) {
          show(`appended to ${name} at index ${body.index} (term ${body.term})`, true);
          input.value = '';
        } else {
          const role = lastStatuses.find(s => s.port === target.port)?.role ?? '?';
          show(`wrong node: ${name} is ${role} in term ${body.term}, ` +
               (body.leaderId ? `leader is ${body.leaderId}` : 'leader unknown'), false);
        }
      }
    } catch {
      show(`${name} is unreachable`, false);
    }
    tick();
  });

  tick();
  setInterval(tick, 300);
</script>
